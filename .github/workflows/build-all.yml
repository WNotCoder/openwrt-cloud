name: Build All Devices

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DIY_U1_SH: diy-update.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  UPLOAD_WEBDAV: false
  TZ: Asia/Shanghai

jobs:
  generate-configs:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Generate device config files
      run: |
        # Device mapping: config_filename -> device_identifier
        declare -A DEVICES=(
          ["RE-SS-01"]="jdcloud_re-ss-01"
          ["RE-CS-02"]="jdcloud_re-cs-02"
          ["GL-AXT1800"]="glinet_gl-axt1800"
          ["360v6"]="qihoo_360v6"
        )

        for name in "${!DEVICES[@]}"; do
          device="${DEVICES[$name]}"
          cp .config "${name}.config"
          # Replace the DEVICE_*=y line: set target device to y, others to "is not set"
          sed -i -E "s/^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_[^ ]+=y$/# CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${device} is not set/" "${name}.config"
          sed -i -E "s/^# CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${device} is not set$/CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${device}=y/" "${name}.config"
          # Update the profile line
          sed -i -E 's/^CONFIG_TARGET_PROFILE="DEVICE_[^"]*"$/CONFIG_TARGET_PROFILE="DEVICE_'${device}'"/' "${name}.config"
          echo "Generated ${name}.config for device ${device}"
          grep "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${device}=y" "${name}.config"
        done

    - name: Set matrix output
      id: set-matrix
      run: |
        MATRIX='{"include":[{"name":"RE-SS-01","config":"RE-SS-01.config","device":"jdcloud_re-ss-01"},{"name":"RE-CS-02","config":"RE-CS-02.config","device":"jdcloud_re-cs-02"},{"name":"GL-AXT1800","config":"GL-AXT1800.config","device":"glinet_gl-axt1800"},{"name":"360v6","config":"360v6.config","device":"qihoo_360v6"}]}'
        echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

    - name: Upload config files
      uses: actions/upload-artifact@main
      with:
        name: config-files
        path: |
          RE-SS-01.config
          RE-CS-02.config
          GL-AXT1800.config
          360v6.config

  build:
    needs: generate-configs
    runs-on: ubuntu-22.04
    strategy:
      matrix: ${{ fromJson(needs.generate-configs.outputs.matrix) }}
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Download config files
      uses: actions/download-artifact@main
      with:
        name: config-files

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Execute after update
      run: |
        chmod +x $DIY_U1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_U1_SH

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e ${{ matrix.config }} ] && mv ${{ matrix.config }} openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ matrix.name }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ matrix.name }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${{ matrix.name }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Upload firmware to WebDAV
      if: env.UPLOAD_WEBDAV == 'true' && !cancelled()
      run: |
        echo "开始上传固件到 WebDAV 服务器..."
        for file in ${{ env.FIRMWARE }}/*; do
          filename=$(basename "$file")
          echo "上传: $filename"
          curl -T "$file" \
            -u "${{ secrets.WEBDAV_USERNAME }}:${{ secrets.WEBDAV_PASSWORD }}" \
            "${{ secrets.WEBDAV_URL }}/${{ matrix.name }}_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}/$filename"
        done
        echo "WebDAV 上传完成"

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
