# Temporary helper: dispatch the multi-thread OpenWrt build once.
# This file is removed immediately after the dispatch succeeds.
name: One-shot Build Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-one-shot-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch multi-thread build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/260031366/dispatches" \
            -f ref=main
          echo "Dispatched workflow 260031366 (multi-thread build) on main"
